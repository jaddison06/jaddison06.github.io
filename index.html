<!DOCTYPE html>

<html>
    <head>
        <script src="onload.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="intro.css" />
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: black;
            }
            .main {
                display: flex;
                height: 79vh;
                width: 65%;
                flex-direction: column;
                justify-content: end;
                padding-left: 9%;
            }
            .main > p {
                font-family: "Karla", sans-serif;
                font-optical-sizing: auto;
                font-weight: 240;
                font-style: normal;
                margin-top: 0;
                margin-left: 0;
                margin-right: 0;
                margin-bottom: 10px;
                font-size: 3.9vmin;
            }
            strong {
                font-weight: 295;
            }
            a {
                color: white;
                transition: all 0.4s;
            }
            a:hover {
                color: black;
                background-color: white;
            }
            #bg-img {
                position: absolute;
                top: 0;
                z-index: -2;
                object-fit: cover;
                width: 100vw;
                height: 100vh;
                filter: brightness(.14);
            }
        </style>
    </head>
    <body>
        <div class="intro">
            <div class="imgcontainer" id="cover">
                <img id="coverimg" />
            </div>
            <div class="imgcontainer" id="jtg1">
                <img src="res/JTG FREAKY.png"/>
            </div>
            <div class="imgcontainer" id="jtg2">
                <img src="res/JTG FREAKY.png"/>
            </div>
        </div>

        <div class="main">
            <p><strong>JTG Design</strong> are a world-class multimedia studio based in London.</p>
            <p>We offer a comprehensive production service, from your initial show concept to on-the-ground support, previsualization and technical direction.</p>
            <p><a href="shows">Take a look</a> at our events, television and theatre work, or <a href=""">get in touch</a> with your idea.</p>
        </div>

        <img id="bg-img" />
